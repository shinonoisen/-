<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>神通川線 のりかえ案内 DEMO</title>
<style>
*{box-sizing:border-box}
:root{
  --navy:#081526;
  --navy2:#0d2038;
  --gold:#c9a45c;
  --gold2:#e4c989;
  --blue:#3f7cff;
  --red:#d72c3b;
  --green:#2b9b73;
  --ink:#152338;
  --muted:#738197;
  --line:#dfe5ed;
  --paper:#f4f6f9;
  --white:#fff;
}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Noto Sans JP","Yu Gothic",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 0%,rgba(201,164,92,.10),transparent 28%),
    radial-gradient(circle at 90% 5%,rgba(63,124,255,.09),transparent 25%),
    var(--paper);
  letter-spacing:.01em;
}
body:before{
  content:"";
  position:fixed;inset:0;pointer-events:none;opacity:.28;
  background-image:linear-gradient(rgba(8,21,38,.025) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(8,21,38,.025) 1px,transparent 1px);
  background-size:32px 32px;z-index:-1;
}
.header{
  position:relative;overflow:hidden;
  color:#fff;padding:30px 20px 92px;
  background:
    radial-gradient(circle at 82% 25%,rgba(201,164,92,.18),transparent 25%),
    linear-gradient(135deg,var(--navy),var(--navy2) 60%,#102b4b);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.header:after{
  content:"";
  position:absolute;left:-5%;right:-5%;bottom:-70px;height:130px;
  background:var(--paper);border-radius:50% 50% 0 0/55% 55% 0 0;
}
.header-inner{max-width:1120px;margin:auto;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:15px}
.logo{
  width:52px;height:52px;border-radius:16px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#fff,#eef2f7);
  color:var(--navy);font-weight:900;font-size:23px;
  box-shadow:0 10px 28px rgba(0,0,0,.24);
  border:1px solid rgba(201,164,92,.65);
}
.header h1{margin:0;font-size:27px;letter-spacing:.04em;font-weight:800}
.header p{margin:7px 0 0;color:#bdc8d7;font-size:13px}
.header p:before{content:"●";color:var(--gold);margin-right:7px;font-size:9px}

.wrap{max-width:1120px;margin:-52px auto 55px;padding:0 18px;position:relative;z-index:2}
.search,.panel{
  background:rgba(255,255,255,.93);
  border:1px solid rgba(255,255,255,.85);
  border-radius:22px;padding:23px;
  box-shadow:0 18px 55px rgba(10,28,52,.12),0 2px 8px rgba(10,28,52,.05);
  backdrop-filter:blur(12px);
}
.search{position:relative}
.search:before{
  content:"ROUTE SEARCH";
  position:absolute;right:22px;top:16px;
  font-size:9px;letter-spacing:.22em;font-weight:800;color:#a2acba;
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:11px;color:#8490a2;margin:0 0 7px;font-weight:700;letter-spacing:.08em}
.field input,.field select{
  width:100%;padding:14px 15px;
  border:1px solid #dbe2eb;border-radius:12px;font-size:16px;
  color:var(--ink);background:#fbfcfe;outline:none;
  transition:.2s;box-shadow:inset 0 1px 2px rgba(8,21,38,.03)
}
.field select:focus,.field input:focus{border-color:#8daaf0;box-shadow:0 0 0 4px rgba(63,124,255,.10)}
.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:15px}
.control{
  border:1px solid #dbe2eb;background:#fff;border-radius:11px;
  padding:10px 13px;color:#435067;cursor:pointer;font-weight:600;
  transition:.18s;box-shadow:0 2px 7px rgba(8,21,38,.035)
}
.control:hover{transform:translateY(-1px);border-color:#b9c4d3;box-shadow:0 6px 14px rgba(8,21,38,.08)}
.primary{
  background:linear-gradient(135deg,#183b68,#0d2747);
  color:#fff;border:0;font-weight:800;cursor:pointer;
  padding:13px 24px;border-radius:11px;margin-left:auto;
  box-shadow:0 9px 22px rgba(13,39,71,.24);
  position:relative;overflow:hidden
}
.primary:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 20%,rgba(255,255,255,.16),transparent 80%);
  transform:translateX(-100%);transition:.45s
}
.primary:hover:after{transform:translateX(100%)}

.tabs{display:flex;gap:7px;margin:21px 0 13px}
.tab{
  border:1px solid #d9e0e9;background:rgba(255,255,255,.82);
  padding:10px 17px;border-radius:999px;cursor:pointer;
  font-weight:700;color:#647086;transition:.2s
}
.tab.active{
  color:#fff;border-color:var(--navy);
  background:linear-gradient(135deg,var(--navy),#15365c);
  box-shadow:0 7px 18px rgba(8,21,38,.18)
}

.card{
  background:rgba(255,255,255,.96);border:1px solid #e4e9f0;
  border-radius:18px;padding:19px;margin-top:12px;
  box-shadow:0 8px 28px rgba(8,21,38,.07);
  transition:.2s;position:relative;overflow:hidden
}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(8,21,38,.10)}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--gold),#e9d6a5)}
.resulthead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-size:19px;font-weight:850;color:var(--navy)}
.route{display:grid;grid-template-columns:66px 1fr;gap:14px;margin-top:15px}
.time{font-weight:850;color:var(--navy)}
.line{border-left:3px solid var(--blue);padding-left:14px}
.line.local{border-color:var(--green)}.line.rapid{border-color:var(--blue)}
.line b{display:block;margin-bottom:4px}.muted{color:var(--muted);font-size:13px}
.badge{display:inline-block;background:#eef2f6;border-radius:999px;padding:4px 8px;font-size:11px;margin-left:6px;font-weight:800}
.badge.rapid{color:#2469c7;background:#edf4ff}.badge.local{color:#23805f;background:#edf8f3}
.note{
  margin-top:16px;padding:12px 14px;background:#f7f8fa;
  border:1px solid #e8ecf1;border-radius:11px;color:#667286;font-size:12px
}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
.section-title h2{font-size:19px;margin:0;color:var(--navy);letter-spacing:.03em}
.pill{font-size:11px;background:#f1f3f6;padding:7px 10px;border-radius:999px;color:#657186;font-weight:700}
.table-wrap{overflow:auto;border:1px solid #dfe5ed;border-radius:15px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
table{border-collapse:separate;border-spacing:0;min-width:1050px;width:100%;font-size:13px;background:#fff}
th,td{padding:10px 10px;border-right:1px solid #e7ebf0;border-bottom:1px solid #e7ebf0;text-align:center;white-space:nowrap}
thead th{background:linear-gradient(#f9fafc,#f1f4f8);position:sticky;top:0;z-index:2;color:#58667b}
thead th:first-child,tbody td:first-child{
  position:sticky;left:0;z-index:3;background:#fff;text-align:left;font-weight:800
}
thead th:first-child{background:#f1f4f8}
tbody tr:hover td{background:#f8fafc}
tbody tr:hover td:first-child{background:#f8fafc}
.rapid-text{color:#1769c5;font-weight:850}.local-text{color:#21815e;font-weight:850}
.empty{color:#c2cad5}.selected{background:#eef5ff}
.small{font-size:10px;color:#98a3b4}
footer{max-width:1120px;margin:0 auto;padding:0 18px 38px;color:#8b96a8;font-size:11px}
footer:before{content:"";display:block;height:1px;background:#dfe4eb;margin-bottom:16px}

@media(max-width:650px){
  .header{padding:23px 16px 78px}
  .header h1{font-size:21px}.header p{font-size:11px}
  .logo{width:46px;height:46px;border-radius:14px}
  .wrap{padding:0 12px;margin-top:-42px}
  .search,.panel{padding:17px;border-radius:18px}
  .search:before{display:none}
  .row{grid-template-columns:1fr}
  .primary{margin-left:0;width:100%}
  .route{grid-template-columns:55px 1fr}
  .tabs{overflow:auto}
  .tab{white-space:nowrap}
}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="brand"><div class="logo">神</div><div><h1>神通川線 のりかえ案内</h1><p>時刻表データを反映したローカル線検索デモ</p></div></div>
  </div>
</header>

<main class="wrap">
<section class="search">
  <div class="row">
    <div class="field"><label>出発駅</label><select id="from"></select></div>
    <div class="field"><label>到着駅</label><select id="to"></select></div>
  </div>
  <div class="controls">
    <button class="control" onclick="setNow()">🕐 今の時刻</button>
    <label class="control">時刻 <input id="time" type="time" value="22:24" style="width:auto;border:0;padding:0 0 0 6px"></label>
    <button class="control" onclick="swapStations()">⇄ 入れ替え</button>
    <button class="primary" onclick="searchRoute()">経路を検索</button>
  </div>
</section>

<div class="tabs">
  <button class="tab active" id="tab-route" onclick="showTab('route')">🚆 経路検索</button>
  <button class="tab" id="tab-table" onclick="showTab('table')">🕐 時刻表</button>
</div>

<section id="routePanel"></section>

<section id="tablePanel" class="panel" style="display:none">
  <div class="section-title">
    <h2>神通川線 時刻表</h2>
    <span class="pill">下り・上りを切替</span>
  </div>
  <div class="controls" style="margin-top:0">
    <button class="control" id="downBtn" onclick="renderTimetable('down')" style="background:#1769e0;color:#fff">下り（布瀬本町方面）</button>
    <button class="control" id="upBtn" onclick="renderTimetable('up')">上り（本芝園方面）</button>
  </div>
  <div class="table-wrap" id="tableWrap"></div>
</section>

<div class="note">※ スクリーンショット8枚（下り4枚・上り4枚）をもとにしたデモ用時刻表です。実際の運行情報・遅延・臨時変更は反映していません。</div>
</main>
<footer>神通川線 DEMO / 時刻表は提供された画像から転記したデータを使用</footer>

<script>
const stationsDown=["本芝園","西安野屋","松川","磯部堤","布瀬公園","神通川緑地","本布瀬","布瀬本町"];
const stationsUp=[...stationsDown].reverse();

const downTimes=[
"05:00","06:00","06:15","06:30","06:45","07:00","07:15","07:30","07:45","08:00","08:15","08:30","08:45","09:00","09:30",
"10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00","16:15","16:30",
"16:45","17:00","17:15","17:30","17:45","18:00","18:15","18:30","18:45","19:00","19:15","19:30","19:45","20:00","20:15",
"20:30","20:45","21:00","21:30","22:00","22:30","23:00","23:30"
];
const downTypes=[
"快速","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車",
"快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速",
"各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車",
"快速","各駅停車","快速","各駅停車","快速","各駅停車","各駅停車","各駅停車"
];

const upTimes=[
"05:00","06:00","06:15","06:30","06:45","07:00","07:15","07:30","07:45","08:00","08:15","08:30","08:45","09:00","09:30",
"10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:20","13:40","14:00","14:30","15:00","15:30","16:00","16:15",
"16:30","16:45","17:00","17:15","17:30","17:45","18:00","18:15","18:30","18:45","19:00","19:15","19:30","19:45","20:00",
"20:30","20:45","21:00","21:30","22:00","22:30","23:00","23:30"
];
const upTypes=[
"快速","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車",
"快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","快速","各駅停車","快速","各駅停車","快速","各駅停車",
"快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速","各駅停車","快速",
"快速","各駅停車","快速","各駅停車","快速","各駅停車","各駅停車","各駅停車"
];

function makeTrains(times,types,direction){
  return times.map((time,i)=>({
    time,type:types[i],direction,
    number:"J"+String((direction==="down"?1:2)+i*2).padStart(4,"0")
  }));
}
const trainsDown=makeTrains(downTimes,downTypes,"down");
const trainsUp=makeTrains(upTimes,upTypes,"up");

function addMin(t,n){
  const [h,m]=t.split(":").map(Number), d=new Date(2026,0,1,h,m+n);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function mins(t){const [h,m]=t.split(":").map(Number);return h*60+m}
function stopsFor(train,dir){
  const s=dir==="down"?stationsDown:stationsUp;
  if(train.type==="快速") return dir==="down"?[0,2,4,6,7]:[0,1,3,5,7];
  return s.map((_,i)=>i);
}
function trainAtStation(train,dir,stationIndex){
  const stops=stopsFor(train,dir);
  if(!stops.includes(stationIndex)) return null;
  const offsets=dir==="down"? [0,1,2,4,6,7,9,10] : [0,1,3,5,6,8,9,10];
  return addMin(train.time,offsets[stationIndex]);
}
function allTrains(){
  return [...trainsDown,...trainsUp];
}

function populateStations(){
  const f=document.getElementById("from"), t=document.getElementById("to");
  stationsDown.forEach(s=>{f.add(new Option(s,s));t.add(new Option(s,s));});
  f.value="本芝園"; t.value="布瀬本町";
}

function searchRoute(){
  const from=document.getElementById("from").value;
  const to=document.getElementById("to").value;
  const after=document.getElementById("time").value;
  const fi=stationsDown.indexOf(from), ti=stationsDown.indexOf(to);
  if(fi===ti){document.getElementById("routePanel").innerHTML='<article class="card"><b>同じ駅です</b><p class="muted">出発駅と到着駅を別の駅にしてください。</p></article>';return;}
  const dir=fi<ti?"down":"up";
  const stations=dir==="down"?stationsDown:stationsUp;
  const a=stations.indexOf(from), b=stations.indexOf(to);
  const trains=dir==="down"?trainsDown:trainsUp;
  const found=trains.filter(tr=>{
    const dep=trainAtStation(tr,dir,a), arr=trainAtStation(tr,dir,b);
    return dep && arr && mins(dep)>=mins(after);
  }).slice(0,8);
  if(!found.length){
    document.getElementById("routePanel").innerHTML=`<article class="card"><b>${from} → ${to}</b><p class="muted">${after}以降の直通列車は見つかりませんでした。</p></article>`;
    return;
  }
  document.getElementById("routePanel").innerHTML=`
    <div class="section-title"><h2>${from} → ${to}</h2><span class="pill">${dir==="down"?"下り":"上り"} / ${found.length}件表示</span></div>
    ${found.map(tr=>{
      const dep=trainAtStation(tr,dir,a),arr=trainAtStation(tr,dir,b);
      const duration=mins(arr)-mins(dep);
      const cls=tr.type==="快速"?"rapid":"local";
      return `<article class="card">
        <div class="resulthead">
          <div><b>${dep} → ${arr}</b><span class="badge ${cls}">${tr.type}</span></div>
          <div><b>${duration}分</b></div>
        </div>
        <div class="route">
          <div class="time">${dep}</div>
          <div class="line ${cls}"><b>${from}</b><span>${tr.type} 神通川線</span><div class="muted">${tr.number} / ${dir==="down"?"布瀬本町方面":"本芝園方面"}</div></div>
        </div>
        <div class="route">
          <div class="time">${arr}</div>
          <div class="line ${cls}"><b>${to}</b><span>到着</span></div>
        </div>
      </article>`;
    }).join("")}`;
}

function showTab(tab){
  document.getElementById("routePanel").style.display=tab==="route"?"block":"none";
  document.getElementById("tablePanel").style.display=tab==="table"?"block":"none";
  document.getElementById("tab-route").classList.toggle("active",tab==="route");
  document.getElementById("tab-table").classList.toggle("active",tab==="table");
  if(tab==="table")renderTimetable("down");
}
function renderTimetable(dir){
  const stations=dir==="down"?stationsDown:stationsUp;
  const trains=dir==="down"?trainsDown:trainsUp;
  document.getElementById("downBtn").style.background=dir==="down"?"#1769e0":"#fff";
  document.getElementById("downBtn").style.color=dir==="down"?"#fff":"#3d4758";
  document.getElementById("upBtn").style.background=dir==="up"?"#e60012":"#fff";
  document.getElementById("upBtn").style.color=dir==="up"?"#fff":"#3d4758";
  let html="<table><thead><tr><th>駅名</th>";
  html+=trains.map(tr=>`<th><span class="${tr.type==="快速"?"rapid-text":"local-text"}">${tr.type}</span><br><span class="small">${tr.number}</span><br><b>${tr.time}</b></th>`).join("");
  html+="</tr></thead><tbody>";
  stations.forEach((s,si)=>{
    html+=`<tr><td>${s}</td>`;
    trains.forEach(tr=>{
      const tm=trainAtStation(tr,dir,si);
      html+=tm?`<td>${tm}</td>`:`<td class="empty">↓</td>`;
    });
    html+="</tr>";
  });
  html+="</tbody></table>";
  document.getElementById("tableWrap").innerHTML=html;
}
function setNow(){
  const d=new Date();
  document.getElementById("time").value=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function swapStations(){
  const f=document.getElementById("from"),t=document.getElementById("to");
  const v=f.value;f.value=t.value;t.value=v;
  searchRoute();
}
populateStations();
searchRoute();
</script>
</body>
</html>
